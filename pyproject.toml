[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "knowledgeops-agent"
version = "0.1.0"
description = "Traceable knowledge research and maintenance agent with human approval and evaluation adapters"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph==1.1.9",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledgeops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

